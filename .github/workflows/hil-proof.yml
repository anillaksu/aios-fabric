name: AIOS Hardware-in-the-Loop Proof

# Single job on the self-hosted [self-hosted, aios-hil] runner (free for private
# repos -- no GitHub-hosted minutes needed). It self-gates: a change that does
# not touch firmware/** or this workflow returns immediately; otherwise it runs
# the full on-silicon proof. Required status check for `master` = `hil-proof`.
# Setup: firmware/arduino/HIL_CI_SETUP.md

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: aios-hil-${{ github.ref }}
  cancel-in-progress: false        # never interrupt a live flash

jobs:
  hil-proof:
    runs-on: [self-hosted, aios-hil]
    timeout-minutes: 25
    env:
      AIOS_HIL_PORT: ${{ vars.AIOS_HIL_PORT || 'COM4' }}
      AIOS_HIL_FQBN: arduino:renesas_uno:unor4wifi
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Decide whether HIL is required for this change
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}...HEAD"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          if git diff --name-only "$RANGE" 2>/dev/null | grep -qE '^firmware/|^\.github/workflows/hil-proof\.yml'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No firmware/** or workflow changes -- HIL proof not required."
          fi

      - if: steps.gate.outputs.run == 'true'
        name: Toolchain
        shell: bash
        run: |
          arduino-cli version
          arduino-cli core list | grep -q renesas_uno || arduino-cli core install arduino:renesas_uno

      - if: steps.gate.outputs.run == 'true'
        name: src/ in sync + both sketches compile clean (pre-flash gate)
        shell: bash
        run: |
          cd firmware/arduino
          chmod +x aios-verify.sh AIOS_HardwareProof/sync-from-firmware.sh
          bash AIOS_HardwareProof/sync-from-firmware.sh --check
          DEFS="-DAIOS_ARDUINO_PROOF -DAIOS_EMBED_SUITE -DESP32S3_RING_BUFFER_SIZE=1024"
          arduino-cli compile -b arduino:renesas_uno:unor4wifi --warnings none \
            --build-property "compiler.cpp.extra_flags=$DEFS" \
            --build-property "compiler.c.extra_flags=$DEFS" AIOS_HardwareProof
          if arduino-cli core list | grep -q esp32:esp32; then
            arduino-cli compile -b esp32:esp32:esp32s3 --warnings none AIOS_S3_Bridge
          else
            echo "::notice::esp32 core absent -- AIOS_S3_Bridge compile skipped"
          fi

      - if: steps.gate.outputs.run == 'true'
        name: On-silicon proof (7 phases)
        shell: bash
        run: cd firmware/arduino && ./aios-verify.sh --out "$GITHUB_WORKSPACE/hil-artifacts"

      - if: ${{ always() && steps.gate.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: aios-hil-proof-${{ github.run_number }}
          path: hil-artifacts/
          retention-days: 30

      - if: ${{ always() && steps.gate.outputs.run == 'true' }}
        name: Assert no gate FAILed and a verdict was reached
        shell: bash
        run: |
          L=hil-artifacts/hardware_proof_serial.log
          grep -qE '^(AIOS|PHASE)_[A-Z0-9_]+=FAIL' "$L" && { echo "a release gate FAILed"; exit 1; }
          grep -qE 'AIOS_HARDWARE_PROOF_VERDICT=(CONDITIONAL_)?PASS' "$L"
