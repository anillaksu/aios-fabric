<!doctype html>
<html lang="tr" data-theme="phosphor">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070B10">
<meta name="mobile-web-app-capable" content="yes">
<title>AI-OS</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">

<!-- Yerel ikon fontu; UI frameworkü yüklenmez. -->
<link rel="stylesheet" href="/vendor/framework7-icons.css">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/themes.css">
<link rel="stylesheet" href="/css/components.css">
<style>
  /* ══ SHELL ══
     Kural: 1 ekran = 1 ana amac, 1 ekran = 1 ana GIRIS yuzeyi.
     Ust bar artik input DEGIL (sadece durum + Control Center).
     Tek giris: alttaki composer. Mic composer'in ICINDE, ayri FAB YOK. */
  html { height: 100%; }
  body { margin: 0; overflow: hidden; }
  /* 100vh Android'de klavye acilinca yanlis hesaplaniyor -> 100dvh */
  #shell { display: flex; flex-direction: column; height: 100dvh; }

  #screen {
    flex: 1 1 auto; overflow-y: auto; overflow-x: hidden;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  #screen::-webkit-scrollbar { display: none; }

  /* ── COMPOSER: tek giris yuzeyi ── */
  #composer {
    flex: 0 0 auto; display: flex; align-items: flex-end; gap: var(--sp-2);
    padding: var(--sp-2) var(--sp-3);
    background: var(--s1); border-top: 1px solid var(--line);
  }
  #composer .cbtn {
    flex: 0 0 auto; width: var(--touch-target); height: var(--touch-target); border-radius: var(--r-md);
    display: flex; align-items: center; justify-content: center;
    background: var(--s2); border: 1px solid var(--line-mid); color: var(--fg-dim);
    cursor: pointer; transition: background var(--t-fast) var(--ease),
                                 color var(--t-fast) var(--ease),
                                 transform var(--t-fast) var(--ease);
  }
  #composer .cbtn:active { transform: scale(.92); }
  #composer .cbtn.primary { background: var(--primary); border-color: var(--primary); color: var(--fg-invert); }
  #composer .cbtn.rec { background: var(--error); border-color: var(--error); color: #fff; animation: crec 1.1s infinite; }
  @keyframes crec { 50% { opacity: .55; } }
  #composer .cbtn i { font-size: 20px; }
  #input {
    flex: 1 1 auto; min-width: 0; box-sizing: border-box;
    background: var(--s2); border: 1px solid var(--line-mid); border-radius: var(--r-md);
    color: var(--fg); font-family: var(--font-ui); font-size: var(--fs-md);
    padding: 10px 12px; outline: none; resize: none;
    min-height: var(--control-h); max-height: 110px; line-height: 1.35;
  }
  #input:focus { border-color: var(--primary); }

  /* ── WORKSPACE DOCK ──
     Sabit kategori tablari degil: Linhx + kullanicinin acik pencereleri.
     Pencere kaydi WindowManager'dan gelir; kategori kesfi Linhx'in icindedir. */
  #windowdock {
    flex: 0 0 auto; display: flex; align-items: center; gap: var(--sp-2);
    overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x proximity; scroll-padding-inline: var(--sp-3);
    background: var(--s1); border-top: 1px solid var(--line);
    min-height: calc(var(--h-tabbar) + env(safe-area-inset-bottom, 0px));
    padding: var(--sp-2) var(--sp-3) calc(var(--sp-2) + env(safe-area-inset-bottom, 0px));
    scrollbar-width: none;
  }
  #windowdock::-webkit-scrollbar { display: none; }
  #window-nodes { display: contents; }
  #surface-nav { display: none; }
  .window-slot { flex: 0 0 auto; display: flex; align-items: stretch; min-height: 42px; scroll-snap-align: center; }
  .window-tab {
    flex: 0 0 auto; min-height: 42px; padding: 7px 12px;
    border-radius: var(--r-md); border: 1px solid var(--line-mid); background: var(--s2);
    color: var(--fg-dim); cursor: pointer; font-family: var(--font-ui); font-size: var(--fs-sm);
    white-space: normal; overflow-wrap: anywhere; text-align: left; line-height: 1.2;
  }
  .window-tab.on { color: var(--primary); border-color: var(--primary); background: var(--primary-a); }
  .window-tab.utility { margin-left: auto; max-width: none; }
  .window-close {
    width: 34px; min-height: 42px; padding: 0; border: 1px solid var(--line-mid); border-left: 0;
    border-radius: 0 var(--r-md) var(--r-md) 0; background: var(--s2); color: var(--fg-dim);
    cursor: pointer; font-size: 18px; line-height: 1;
  }
  .window-slot .window-tab { border-radius: var(--r-md) 0 0 var(--r-md); }
  .window-slot.is-active .window-close { color: var(--primary); border-color: var(--primary); background: var(--primary-a); }
  .window-slot.is-entering { animation: window-dock-enter var(--t-base) var(--ease) both; }
  .window-slot.is-closing { pointer-events: none; animation: window-dock-exit var(--t-fast) var(--ease) both; }
  .window-grip { display: none; }
  @keyframes window-dock-enter { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes window-dock-exit { to { opacity: 0; transform: translateY(8px) scale(.96); } }
  @media (prefers-reduced-motion: reduce) { .window-slot.is-entering, .window-slot.is-closing { animation: none; } }

  /* Klavye acikken dock gizlenir - composer ekranin dibinde kalir */
  body.kb #windowdock { display: none; }
  body.kb #composer { padding-bottom: var(--sp-2); }

  /* Operator Deck bir terminal kopyasi degil, dokunmatik tam AIOS yuzeyidir.
     Geri dugmesi sayfa basliginda kalir; composer/dock bu odakli yönetim
     akisini daraltmaz. */
  body.operator-mode #composer,
  body.operator-mode #windowdock { display: none; }
  body.operator-mode #screen { overscroll-behavior-y: contain; }

  /* ── WORKSPACE SURFACE PROFILES ─────────────────────────────
     Ayni WindowManager kayitlari cizilir; profil yeni state veya execution
     yolu acmaz. Adlar AIOS'a aittir, herhangi bir platform taklidi degildir. */
  :root[data-workspace-surface="stack"] #windowdock { gap: 0; padding-inline: var(--sp-2); }
  :root[data-workspace-surface="stack"] .window-slot { margin-left: -8px; }
  :root[data-workspace-surface="stack"] .window-slot:first-child { margin-left: 0; }
  :root[data-workspace-surface="stack"] .window-tab { min-width: 128px; box-shadow: -5px 0 14px rgba(0,0,0,.22); }
  :root[data-workspace-surface="stack"] .window-slot.is-active { z-index: 2; }

  :root[data-workspace-surface="cards"] #windowdock { padding-inline: var(--sp-4); gap: var(--sp-3); }
  :root[data-workspace-surface="cards"] .window-slot { min-width: min(68vw, 264px); }
  :root[data-workspace-surface="cards"] .window-tab { width: 100%; min-height: 56px; padding: var(--sp-3); border-radius: var(--r-lg) 0 0 var(--r-lg); }
  :root[data-workspace-surface="cards"] .window-close { min-height: 56px; border-radius: 0 var(--r-lg) var(--r-lg) 0; }

  :root[data-workspace-surface="classic"] #surface-nav,
  :root[data-workspace-surface="gesture"] #surface-nav {
    flex: 0 0 auto; display: grid; grid-template-columns: repeat(5, 1fr);
    min-height: calc(var(--h-tabbar) + env(safe-area-inset-bottom, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--s1); border-top: 1px solid var(--line);
  }
  :root[data-workspace-surface="classic"] #surface-nav button,
  :root[data-workspace-surface="gesture"] #surface-nav button {
    border: 0; background: transparent; color: var(--fg-mute); min-height: var(--touch-target); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  #surface-nav i { font-size: 20px; }
  #surface-nav span { font-family: var(--font-mono); font-size: var(--fs-micro); letter-spacing: var(--ls-micro); }
  #surface-nav button[data-active="1"] { color: var(--primary); background: var(--primary-a); }
  :root[data-workspace-surface="classic"] #windowdock { display: none; }
  :root[data-workspace-surface="gesture"] #windowdock { min-height: 50px; padding-block: 4px; }
  :root[data-workspace-surface="gesture"] #linhx-root,
  :root[data-workspace-surface="gesture"] .window-close { display: none; }
  :root[data-workspace-surface="gesture"] .window-tab { min-width: 88px; padding-inline: 9px; border-radius: var(--r-pill); }
  :root[data-workspace-surface="gesture"] #cc-open { font-size: 0; width: var(--touch-target); min-width: var(--touch-target); padding: 0; }
  :root[data-workspace-surface="gesture"] #cc-open::before { content:"☷"; font-size: 18px; }

  :root[data-workspace-surface="canvas"] #windowdock {
    min-height: 214px; align-items: stretch; padding: var(--sp-2); gap: var(--sp-2);
    background: linear-gradient(135deg, var(--s1), var(--s2));
  }
  :root[data-workspace-surface="canvas"] #linhx-root,
  :root[data-workspace-surface="canvas"] #cc-open { align-self: flex-end; z-index: 3; }
  :root[data-workspace-surface="canvas"] #window-nodes {
    display: block; position: relative; flex: 0 0 720px; height: 190px;
    border: 1px dashed var(--line-hi); border-radius: var(--r-lg);
    background-image: radial-gradient(var(--line-hi) 1px, transparent 1px); background-size: 18px 18px;
  }
  :root[data-workspace-surface="canvas"] .window-slot {
    position: absolute; left: 0; top: 0; min-width: 156px; max-width: 214px;
    transform: translate(var(--canvas-x, 0px), var(--canvas-y, 0px));
    transition: box-shadow var(--t-fast) var(--ease); touch-action: none;
  }
  :root[data-workspace-surface="canvas"] .window-tab { min-width: 112px; padding: 8px 10px 8px 6px; }
  :root[data-workspace-surface="canvas"] .window-grip {
    display: grid; place-items: center; width: 30px; border: 1px solid var(--line-mid); border-right: 0;
    border-radius: var(--r-md) 0 0 var(--r-md); background: var(--s3); color: var(--fg-mute); cursor: grab;
  }
  :root[data-workspace-surface="canvas"] .window-slot:has(.window-grip:active) { z-index: 4; box-shadow: var(--atmo-glow); }
  :root[data-workspace-surface="canvas"] .window-slot .window-tab { border-radius: 0; }

  @media (prefers-reduced-motion: reduce) {
    :root[data-workspace-surface="canvas"] .window-slot { transition: none; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="shell">

    <div id="screen"></div>

    <!-- TEK giris yuzeyi: mic ICERIDE, ayri FAB yok -->
    <div id="composer">
      <button class="cbtn" id="mic" aria-label="Sesli komut"><i class="icon f7-icons">mic_fill</i></button>
      <textarea id="input" rows="1" placeholder="Ne yapmak istiyorsun?"></textarea>
      <button class="cbtn primary" id="send" aria-label="Gönder"><i class="icon f7-icons">arrow_up</i></button>
    </div>

    <nav id="surface-nav" aria-label="AIOS bölümleri">
      <button data-tab="home" aria-label="Ana çalışma alanı"><i class="icon f7-icons">house_fill</i><span>HOME</span></button>
      <button data-tab="komut" aria-label="Keşfet"><i class="icon f7-icons">magnifyingglass</i><span>KEŞFET</span></button>
      <button data-tab="artifacts" aria-label="Artefaktlar"><i class="icon f7-icons">square_stack_3d_up_fill</i><span>ARTEFAKT</span></button>
      <button data-tab="activity" aria-label="Aktif görevler"><i class="icon f7-icons">list_bullet</i><span>AKTİF</span></button>
      <button data-tab="hermes" aria-label="Linhx"><i class="icon f7-icons">sparkles</i><span>LINHX</span></button>
    </nav>
    <div id="windowdock" aria-label="Çalışma pencereleri">
      <button class="window-tab on" id="linhx-root">Linhx</button>
      <div id="window-nodes"></div>
      <button class="window-tab utility" id="cc-open" aria-label="Kontrol merkezi">Kontrol</button>
    </div>
  </div>
</div>

<script type="module">
  import { boot } from "/js/app.js";

  /* Klavye tepkisi: Android'de klavye acilinca layout viewport degismiyor,
     visualViewport degisiyor. Bunu izleyip shell yuksekligini kisiyoruz ki
     composer klavyenin USTUNDE kalsin, icerik de ezilmesin. */
  const vv = window.visualViewport;
  if (vv) {
    const sync = () => {
      const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      document.body.classList.toggle("kb", kb > 120);
      document.getElementById("shell").style.height = (vv.height + vv.offsetTop) + "px";
    };
    vv.addEventListener("resize", sync);
    vv.addEventListener("scroll", sync);
    // B-10 (2026-08-17): soguk PWA acilisinda innerHeight ile visualViewport
    // gecici olarak uyusmuyor (Android sistem cubuklari henuz yerlesmeden) -
    // ilk cagri yanlislikla kb>120 hesaplayip #tabbar'i gizleyebiliyordu.
    // Cift rAF ile iki cizim karesi beklenir, degerler oturduktan sonra
    // hesaplanir. Klavye ac/kapat'in duzeltmesi de ayni sebepten: gercek
    // bir resize olayi, degerler zaten oturmus halde tetikleniyor.
    requestAnimationFrame(() => requestAnimationFrame(sync));
  }

  boot();
</script>
</body>
</html>
